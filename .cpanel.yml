# DEPLOYPATH is OUTSIDE public_html on purpose: the Laravel app root (with
# .env, app/, vendor/) must never be web-reachable. The api.oruidoscomputadores.pt
# subdomain's Document Root in cPanel -> Domains must point at
# $DEPLOYPATH/public, NOT at $DEPLOYPATH itself. See README "Deploy" section.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mercadom/rui-tech-helper-api-app/
    - rsync -av --exclude='.env' --exclude='.git' --exclude='storage/app' --exclude='storage/logs' ./ $DEPLOYPATH
    - /usr/local/bin/php -r "if (!file_exists('{$DEPLOYPATH}.env')) { echo 'AVISO: .env em falta em produção, criar manualmente.'; }"
